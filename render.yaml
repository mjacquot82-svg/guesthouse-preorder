services:
  - type: web
    name: guesthouse-preorder-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: python -m pip install .
    preDeployCommand: python -m app.db.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    domains:
      - api.ladels.jdsstudio.ca
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://ladels.jdsstudio.ca
      - key: SUPABASE_AUTH_URL
        sync: false
      - key: SUPABASE_AUTH_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_AUTH_SECRET_KEY
        sync: false
      - key: JDS_AUTH_SESSION_PEPPER
        sync: false
      - key: JDS_APPLICATION_KEY
        value: jds-commerce
      - key: JDS_ORGANIZATION_SLUG
        value: the-guest-house
      - key: PUBLIC_APP_URL
        value: https://api.ladels.jdsstudio.ca
      - key: CLOVER_ENVIRONMENT
        value: production
      - key: CLOVER_APP_ID
        sync: false
      - key: CLOVER_APP_SECRET
        sync: false
      - key: CLOVER_MERCHANT_ID
        sync: false
      - key: CLOVER_STATE_SECRET
        sync: false
      - key: CLOVER_WEBHOOK_SECRET
        sync: false
      - key: CLOVER_TOKEN_ENCRYPTION_KEY
        sync: false
